# Development profile
spring.devtools.restart.enabled=false

spring.datasource.url=jdbc:mysql://${DATABASE_URL:localhost}:${DATABASE_PORT:3306}/${DATABASE_NAME:fuelguard_platform}?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.username=${DATABASE_USER:root}
spring.datasource.password=${DATABASE_PASSWORD:123456789}
spring.datasource.hikari.maximum-pool-size=${DATABASE_MAX_POOL_SIZE:3}
spring.datasource.hikari.minimum-idle=${DATABASE_MIN_IDLE:1}

# JWT Secret por defecto para desarrollo local
authorization.jwt.secret=${AUTHORIZATION_JWT_SECRET:un_secreto_super_seguro_para_jwt_32bytes_minimo!}

# Developer-friendly JPA behavior
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true

# Schema migrations (Flyway owns DDL; runtime only validates)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# App port
server.port=${PORT:8080}
